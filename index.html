<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHD Literature — 情绪驱动角色决策计算方法文献库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══ Top Bar ══════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="topbar-logo">
    <span>PHD</span> Literature
  </div>

  <div class="topbar-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" placeholder="搜索标题、作者、关键词… ( / 快捷键)" autocomplete="off">
  </div>

  <div class="topbar-right">
    <!-- 服务器状态指示 -->
    <span id="server-badge" class="server-badge offline" title="检测中…" onclick="serverOnline ? openPdfManager() : showOfflineNotice()">
      <span class="dot"></span>检测中
    </span>
    <!-- 联网搜索按钮 -->
    <button class="action-btn search-online-btn" onclick="openSearch()" title="联网搜索论文">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      联网搜索
    </button>

    <span class="stat-chip">
      <span id="stat-total">0</span>&nbsp;<span id="stat-cats"></span>
    </span>

    <div class="view-btns">
      <button data-view="grid" class="active" title="卡片视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
      <button data-view="list" title="列表视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button data-view="table" title="表格视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3h18v18H3z"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
      </button>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" onclick="openAddPaper()" title="添加论文">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="openCompare()" title="对比选中论文">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="exportBibtexAll()" title="导出BibTeX">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">
        <!-- filled by app.js -->
      </button>
    </div>
  </div>
</header>

<!-- ══ Layout ═══════════════════════════════════════════════════ -->
<div class="layout">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">按类别筛选</div>
      <div id="filter-bar">
        <button class="filter-btn active" data-cat="all">
          <span class="cat-dot" style="background:#9CA3AF"></span>
          全部 <span class="count" id="cnt-all"></span>
        </button>
        <button class="filter-btn" data-cat="rule">
          <span class="cat-dot" style="background:#0F6E56"></span>
          规则系统 <span class="count" id="cnt-rule"></span>
        </button>
        <button class="filter-btn" data-cat="llm">
          <span class="cat-dot" style="background:#185FA5"></span>
          纯LLM <span class="count" id="cnt-llm"></span>
        </button>
        <button class="filter-btn" data-cat="finetune">
          <span class="cat-dot" style="background:#534AB7"></span>
          LLM微调 <span class="count" id="cnt-finetune"></span>
        </button>
        <button class="filter-btn" data-cat="rag">
          <span class="cat-dot" style="background:#854F0B"></span>
          RAG <span class="count" id="cnt-rag"></span>
        </button>
        <button class="filter-btn" data-cat="hybrid">
          <span class="cat-dot" style="background:#993C1D"></span>
          混合架构 <span class="count" id="cnt-hybrid"></span>
        </button>
        <button class="filter-btn" data-cat="game">
          <span class="cat-dot" style="background:#3B6D11"></span>
          游戏/互动叙事 <span class="count" id="cnt-game"></span>
        </button>
        <button class="filter-btn" data-cat="resource">
          <span class="cat-dot" style="background:#5F5E5A"></span>
          情绪库/资源 <span class="count" id="cnt-resource"></span>
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">筛选条件</div>
      <div class="sidebar-control">
        <label>最低相关度</label>
        <select id="filter-stars">
          <option value="0">不限</option>
          <option value="3">3星以上</option>
          <option value="4">4星以上</option>
          <option value="5">5星（经典）</option>
        </select>
      </div>
      <div class="sidebar-control">
        <label>排序方式</label>
        <select id="sort-select">
          <option value="year_desc">年份（新→旧）</option>
          <option value="year_asc">年份（旧→新）</option>
          <option value="stars_desc">相关度（高→低）</option>
          <option value="title_asc">标题字母序</option>
        </select>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="filter-bookmark"> 只看已收藏
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="filter-read"> 只看已读
      </label>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">工具</div>
      <div class="sidebar-actions">
        <button class="action-btn" onclick="openAddPaper()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加新论文
        </button>
        <button class="action-btn" onclick="openCompare()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
          对比已选论文
        </button>
        <button class="action-btn" onclick="exportBibtexAll()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 BibTeX
        </button>
        <button class="action-btn" onclick="exportCsv()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          导出 CSV
        </button>
        <button class="action-btn" onclick="importJson()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入 JSON
        </button>
        <button class="action-btn" onclick="resetFilters()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          重置筛选
        </button>
        <button class="action-btn danger" onclick="resetDb()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          重置数据库
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">快捷键</div>
      <div style="font-size:11.5px;color:var(--text3);padding:0 6px;line-height:2">
        <kbd>/</kbd> 搜索<br>
        <kbd>Esc</kbd> 关闭弹窗<br>
        点击卡片查看详情<br>
        对比：最多4篇
      </div>
    </div>

  </aside>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <main class="main">

    <!-- Compare bar -->
    <div id="compare-bar">
      <span class="compare-count"></span>
      <div class="compare-chips"></div>
      <button class="action-btn" onclick="openCompare()">查看对比</button>
      <button class="action-btn secondary" onclick="clearCompare()">清除</button>
    </div>

    <!-- Papers -->
    <div id="papers-container" class="papers-container view-grid"></div>

  </main>
</div>

<!-- ══ Detail Modal ══════════════════════════════════════════════ -->
<div id="modal-overlay" class="overlay"></div>

<!-- ══ Compare Modal ═════════════════════════════════════════════ -->
<div id="compare-overlay" class="overlay"></div>

<!-- ══ Add/Edit Modal ════════════════════════════════════════════ -->
<div id="add-overlay" class="overlay"></div>

<!-- ══ Search / PDF Modal ════════════════════════════════════════ -->
<div id="search-overlay" class="overlay" onclick="if(event.target===this)closeSearch()"></div>

<!-- ══ Toast Container ═══════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ══ Scripts ═══════════════════════════════════════════════════ -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
